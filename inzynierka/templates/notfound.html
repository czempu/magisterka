<!DOCTYPE html>
<html lang="pl" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nie znaleziono</title>
    <script src="https://cdn.tailwindcss.com"></script>
<link rel="icon" type="image/x-icon" href="/public/lib/img/favicon.png">
</head>
<body class="h-full bg-white flex flex-col items-center justify-center p-6 m-0">

    <h1 class="text-black text-2xl md:text-4xl font-bold uppercase tracking-tighter mb-8">
        Nie znaleziono
    </h1>
    <button 
        onclick="window.location.href='/'" 
        class="bg-black text-white px-8 py-3 font-semibold uppercase tracking-wide transition-colors duration-300 hover:bg-lime-500 hover:text-black">
        Zabierz mnie do strony głównej
    </button>

    <button 
        onclick="window.history.back()" 
        class="bg-black text-white px-8 py-3 font-semibold uppercase tracking-wide transition-colors duration-300 hover:bg-lime-500 hover:text-black">
        Powrót
    </button>

</body>
</html>
