{{ define "sidebar.html" }}
<aside 
  class="bg-white border-r shadow-sm h-screen transition-all duration-300 flex flex-col z-30 md:z-0
         fixed md:static inset-y-0 left-0"
  :class="sidebarOpen ? 'w-64 translate-x-0' : 'w-64 -translate-x-full md:translate-x-0 md:w-20'"
>
  <!-- Logo / Header -->
  <div class="flex items-center justify-between p-4 border-b border-gray-200">
    <h1 class="font-bold text-xl truncate" x-show="sidebarOpen" x-transition x-text="$store.i18n ? $store.i18n.t('nav.menu') : 'Menu'">Menu</h1>
    <button @click="sidebarOpen = !sidebarOpen" class="p-1 rounded hover:bg-gray-100 transition">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
              d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
  </div>

  <!-- Nawigacja -->
  <nav class="flex-1 overflow-y-auto p-4 space-y-1">
    <template x-for="module in modules" :key="module.id">
      <a 
        class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 transition group"
        :href="'/app/' + encodeURIComponent(module.module_name)"
        :title="getModuleLabel(module)"
      >
        <img :src="module.icon"
             class="w-5 h-5 text-gray-500 group-hover:text-gray-700" 
             alt="">
        <span x-show="sidebarOpen" x-transition x-text="getModuleLabel(module)" class="truncate"></span>
      </a>
    </template>
  </nav>

  <!-- Logout -->
  <div class="p-4 border-t border-gray-200">
    <a href="/logout" class="flex items-center justify-center gap-2 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg transition">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
      </svg>
      <span x-show="sidebarOpen" x-transition x-text="$store.i18n ? $store.i18n.t('nav.logout') : 'Wyloguj'">Wyloguj</span>
    </a>
  </div>
</aside>
{{ end }}
