{{ define "leavesinfo.html" }}
{{ template "layout-start" . }}

<div class="max-w-4xl mx-auto p-4 md:p-8 space-y-6"
     x-data="records({ requestId: {{ .Leave.ID }} })"
     x-init="init()">

  <!-- HEADER -->
  <header class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
    <div class="space-y-1">
      <nav class="text-xs md:text-sm text-gray-500">
        <a href="/app/leaves" class="hover:text-gray-700">Urlopy</a>
        <span class="mx-1">/</span>
        <span>Szczegóły wniosku</span>
      </nav>
      <h1 class="text-lg md:text-xl font-semibold">Pozycje wniosku urlopowego</h1>
    </div>

    <div class="text-xs md:text-sm text-gray-500">
      <span class="inline-flex items-center px-3 py-1 rounded-full bg-lime-50 text-lime-700 border border-lime-100">
        ID wniosku:
        <span class="ml-1 font-mono font-semibold" x-text="requestId"></span>
      </span>
    </div>
  </header>

  <!-- komunikaty -->
  <section class="space-y-2">
    <div x-show="loading" class="text-xs md:text-sm text-gray-600">
      Ładowanie...
    </div>
    <div x-show="error" x-text="error" class="text-xs md:text-sm text-red-600"></div>
  </section>

  <!-- lista rekordów -->
  <section class="bg-white rounded-2xl shadow-sm border border-gray-200 p-4 md:p-6 space-y-4">
    <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-2">
      <div>
        <h2 class="text-base md:text-lg font-semibold">Pozycje wniosku</h2>
        <p class="text-[11px] md:text-xs text-gray-500">
          Wniosek może zawierać wiele pozycji (np. godziny + pełne dni).
        </p>
      </div>

      <!-- podsumowanie -->
      <div class="flex flex-wrap items-center gap-2 text-[11px] md:text-xs text-gray-600" x-show="rows.length > 0">
        <span class="inline-flex items-center px-2 py-1 rounded-full border border-gray-200 bg-gray-50">
          Pozycji: <span class="ml-1 font-semibold text-gray-800" x-text="rows.length"></span>
        </span>
        <span class="inline-flex items-center px-2 py-1 rounded-full border border-gray-200 bg-gray-50">
          Suma efektywnych: <span class="ml-1 font-semibold text-gray-800" x-text="totalEffectiveMinutes"></span> min
        </span>
      </div>
    </div>

    <template x-if="rows.length === 0 && !loading && !error">
      <p class="text-xs md:text-sm text-gray-500">Brak pozycji do wyświetlenia.</p>
    </template>

    <ul class="space-y-3" x-show="rows.length > 0" x-cloak>
      <template x-for="(row, idx) in rows" :key="row.ID">
        <li class="border border-gray-200 rounded-xl p-4 bg-gray-50 text-xs md:text-sm">
          <div class="flex flex-col sm:flex-row sm:justify-between sm:items-start gap-2">
            <div class="min-w-0">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="text-[10px] uppercase tracking-wide px-2 py-0.5 rounded-full border"
                      :class="row.Unit === 'day' ? 'border-lime-200 bg-lime-50 text-lime-800' : 'border-gray-200 bg-white text-gray-700'"
                      x-text="row.Unit === 'day' ? 'DAY' : 'HOUR'">
                </span>
                <span class="text-[11px] md:text-xs text-gray-500">
                  Pozycja <span class="font-semibold text-gray-800" x-text="idx + 1"></span>
                  · ID pozycji: <span class="font-mono" x-text="row.ID"></span>
                </span>
              </div>

              <div class="mt-1 font-medium text-gray-900 break-words" x-text="row.Note || 'Bez opisu'"></div>
              <div class="mt-1 text-[11px] md:text-xs text-gray-500">
                ID wniosku: <span class="font-mono" x-text="row.Request_id"></span>
              </div>
            </div>

            <div class="text-right">
              <div class="text-[11px] md:text-xs text-gray-500">Efektywne</div>
              <div class="font-semibold text-gray-900">
                <span x-text="row.Effective_minutes"></span> min
              </div>
            </div>
          </div>

          <div class="mt-3 grid grid-cols-1 md:grid-cols-2 gap-2 text-[0.75rem] md:text-xs text-gray-700">
            <div>
              <span class="font-semibold">Od:</span>
              <span class="ml-1" x-text="formatDT(row.Start_at)"></span>
            </div>
            <div>
              <span class="font-semibold">Do:</span>
              <span class="ml-1" x-text="formatDT(row.End_at)"></span>
            </div>
            <div>
              <span class="font-semibold">Ilość:</span>
              <span class="ml-1" x-text="row.Quantity"></span>
              <span class="ml-1 text-gray-600">[<span x-text="row.Unit"></span>]</span>
            </div>
            <div>
              <span class="font-semibold">Okres:</span>
              <span class="ml-1 text-gray-700" x-text="rangeHint(row)"></span>
            </div>
          </div>
        </li>
      </template>
    </ul>
  </section>
</div>

<script>
  function records({ requestId }) {
    return {
      requestId,
      rows: [],
      loading: false,
      error: null,

      get totalEffectiveMinutes() {
        return (this.rows || []).reduce((acc, r) => acc + (Number(r.Effective_minutes) || 0), 0);
      },

      // Ucina mikrosekundy i zostawia "YYYY-MM-DD HH:MM:SS"
      formatDT(s) {
        if (!s) return '';
        // przykłady: "2026-01-22 22:03:00.000000"
        // lub "2026-01-22 23:59:59.999999"
        const v = String(s);
        const dot = v.indexOf('.');
        return dot > -1 ? v.slice(0, dot) : v;
      },

      rangeHint(row) {
        // mały „hint” czy to wygląda na pełny dzień, itp.
        const unit = (row && row.Unit) ? String(row.Unit) : '';
        if (unit === 'day') return 'Pozycja dzienna (pełny dzień)';
        if (unit === 'hour') return 'Pozycja godzinowa';
        return '—';
      },

      async init() {
        this.loading = true;
        this.error = null;
        try {
          const res = await fetch('/api/request/' + this.requestId);
          if (!res.ok) throw new Error("HTTP " + res.status);
          const json = await res.json();
          const data = Array.isArray(json.data) ? json.data : [];
          // sort po starcie rosnąco, żeby było czytelnie przy wielu pozycjach
          data.sort((a, b) => String(a.Start_at || '').localeCompare(String(b.Start_at || '')));
          this.rows = data;
        } catch (e) {
          this.error = e.message || 'Nie udało się pobrać danych.';
        } finally {
          this.loading = false;
        }
      }
    }
  }
</script>

{{ template "layout-end" . }}
{{ end }}
