services:
  api:
    build: .
    ports:
      - "8080:8080"
      - "2345:2345" # Port dla Debuggera
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    # Zostawiamy czyste wywołanie, Air sam znajdzie swój plik konfiguracyjny
    command: air

  db:
    image: mysql:8.0
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Czempu2025}
      MYSQL_USER: ${MYSQL_USER:-CZEMPU}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Czempu2025}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-RCP}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
